<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My Day — Sharma Electric &amp; HVAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#264387; --navy-dark:#1a2f61; --gold:#F0A846;
    --ink:#1d2433; --gray:#5b6478; --line:#dfe4ee; --page:#f4f6fb;
    --r:4px;
    --head:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
    --body:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;
    --mono:'IBM Plex Mono',Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;}
  a{color:inherit;}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  /* Header: white, real logo, 3px gold line */
  header.top{background:#fff;border-bottom:3px solid var(--gold);}
  header.top .wrap{display:flex;align-items:center;gap:12px;min-height:76px;padding-top:10px;padding-bottom:10px;}
  header.top img{height:44px;width:auto;max-width:62vw;display:block;}
  header.top .app{margin-left:auto;text-align:right;font-family:var(--head);font-weight:700;font-size:18px;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-dark);}
  header.top .app small{display:block;font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--gray);margin-top:3px;}
  @media (min-width:700px){ header.top img{height:56px;} }

  /* Day hero + summary strip */
  .hero{background:#fff;border-bottom:1px solid var(--line);}
  .hero .wrap{padding-top:16px;padding-bottom:16px;}
  .hero-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .kicker{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);}
  .hero h1{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.05;color:var(--navy-dark);margin-top:2px;}
  .hero .btns{margin-left:auto;display:flex;gap:8px;}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--line);overflow:hidden;}
  .stat{padding:10px 12px;background:#fff;}
  .stat:last-child{grid-column:1/-1;}
  .stat .n{font-family:var(--mono);font-weight:600;font-size:28px;line-height:1.1;color:var(--navy-dark);font-variant-numeric:tabular-nums;}
  .stat .n small{font-size:16px;font-weight:500;color:var(--gray);margin-left:2px;}
  .stat .l{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);}
  @media (min-width:700px){ .stats{grid-template-columns:repeat(5,1fr);} .stat:last-child{grid-column:auto;} }
  .progress{margin-top:12px;display:flex;align-items:center;gap:12px;}
  .progress .bar{flex:1;height:6px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress .bar i{display:block;height:6px;background:var(--gold);width:0;}
  .progress .txt{font-family:var(--mono);font-size:16px;color:var(--ink);white-space:nowrap;}

  /* Week picker */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;}
  .week .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--navy-dark);text-decoration:none;}
  .week .chip .dn{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;line-height:1;}
  .week .chip .dd{font-family:var(--mono);font-weight:600;font-size:18px;line-height:1.2;}
  .week a.chip{border-color:var(--navy);}
  .week .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;border-bottom:4px solid var(--gold);}
  .week .chip.off{background:var(--page);color:var(--gray);}

  /* Tabs */
  .tabs{display:flex;gap:0;margin-top:14px;border:1px solid var(--navy);border-radius:var(--r);overflow:hidden;}
  .tab{flex:1;min-height:52px;border:none;background:#fff;color:var(--navy);font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;}
  .tab + .tab{border-left:1px solid var(--navy);}
  .tab.on{background:var(--navy);color:#fff;}
  .tab .cnt{font-family:var(--mono);font-size:16px;font-weight:600;background:var(--gold);color:var(--navy-dark);border-radius:3px;padding:0 7px;margin-left:8px;}
  .tab .cnt:empty{display:none;}

  /* Panels and section heads */
  main{padding:16px 0 8px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;}
  .panel > h2{font-family:var(--head);font-weight:700;font-size:24px;line-height:1.1;color:var(--navy-dark);padding-bottom:6px;border-bottom:2px solid var(--gold);margin-bottom:4px;display:flex;align-items:baseline;gap:10px;}
  .panel > h2 .sub{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:16px;color:var(--gray);}
  @media (min-width:900px){
    .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;}
    .grid .panel{margin-bottom:16px;}
  }

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:0 16px;border:1px solid var(--navy);border-radius:var(--r);background:#fff;color:var(--navy);font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;}
  .btn.solid{background:var(--navy);color:#fff;}
  .btn:active{background:var(--navy-dark);color:#fff;}

  /* Route timeline */
  .tl{margin-top:8px;}
  .node{display:grid;grid-template-columns:76px 24px 1fr;}
  .node .tm{padding-top:14px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .node .tm .t{font-size:18px;font-weight:600;color:var(--ink);line-height:1.2;white-space:nowrap;}
  .node .tm .e{font-size:16px;color:var(--gray);white-space:nowrap;}
  .rail{position:relative;}
  .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-1px);}
  .node .rail::after{content:"";position:absolute;left:50%;top:18px;width:12px;height:12px;background:#fff;border:2px solid var(--navy);border-radius:2px;transform:translateX(-50%);}
  .node.start .rail::after{background:var(--navy);}
  .node.next .rail::after{background:var(--gold);border-color:var(--gold);}
  .node.done .rail::after{background:var(--line);border-color:var(--gray);}
  .node.first .rail::before{top:20px;}
  .node.last .rail::before{bottom:auto;height:20px;}
  .node .bd{padding:12px 0 16px 12px;min-width:0;}
  .node.next .bd{border-left:3px solid var(--gold);padding-left:12px;margin-left:4px;}
  .leg{display:grid;grid-template-columns:76px 24px 1fr;min-height:40px;}
  .leg .rail::before{background:none;width:0;border-left:2px dashed var(--navy);}
  .leg .dv{display:flex;align-items:center;padding-left:12px;font-family:var(--mono);font-size:16px;color:var(--gray);}
  .leg .dv b{font-weight:600;color:var(--navy-dark);margin-right:6px;}
  .leg .dv.unk{color:var(--gray);font-style:italic;}
  .ttl{display:flex;align-items:flex-start;gap:10px;}
  .ttl .name{font-family:var(--head);font-weight:700;font-size:22px;line-height:1.15;color:var(--ink);flex:1;min-width:0;}
  .node.done .name{text-decoration:line-through;color:var(--gray);}
  .node.done .bd > *:not(.ttl){opacity:.6;}
  .addr{margin-top:2px;font-size:16px;color:var(--gray);}
  .job{margin-top:4px;font-size:17px;color:var(--navy);font-weight:600;}
  .meta{margin-top:4px;font-size:16px;color:var(--ink);}
  .sf{margin-top:6px;font-family:var(--mono);font-size:16px;color:var(--ink);}
  .flag{display:inline-block;margin-top:8px;padding:6px 10px;border:1px solid var(--gold);border-left:6px solid var(--gold);border-radius:var(--r);background:#fff;font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy-dark);}
  .acts{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .acts .lnk{font-size:16px;font-weight:600;color:var(--navy);text-decoration:none;border-bottom:2px solid var(--gold);padding:12px 0 2px;}
  .taskicon{width:44px;height:44px;border-radius:var(--r);flex:none;display:block;}
  .taskbanner{display:none;width:100%;height:auto;border-radius:var(--r);margin-bottom:10px;}
  .node.next .taskbanner{display:block;}
  .brand{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .brand img{height:32px;max-width:170px;object-fit:contain;display:block;}
  .bbadge{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--navy-dark);border:1px solid var(--navy);border-radius:var(--r);padding:3px 10px;}
  .mats{margin-top:10px;}
  .mlabel{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:3px;}

  /* Checklists */
  .list{list-style:none;}
  .list li{border-bottom:1px solid var(--line);}
  .list li:last-child{border-bottom:none;}
  .ck{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:11px 0;cursor:pointer;}
  .chk{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin-top:0;background:#fff;border:2px solid var(--navy);border-radius:3px;cursor:pointer;position:relative;}
  .chk:checked{background:var(--gold);border-color:var(--gold);}
  .chk:checked::after{content:"";position:absolute;left:7.5px;top:3px;width:6px;height:12px;border:solid var(--navy-dark);border-width:0 3px 3px 0;transform:rotate(42deg);}
  .ck .txt{flex:1;min-width:0;font-size:17px;}
  .off .txt{color:var(--gray);text-decoration:line-through;}
  .ck .cnt{font-family:var(--mono);font-size:16px;color:var(--gray);flex:none;}
  .stopck{min-height:0;padding:0;margin-top:2px;}
  .matph{width:40px;height:40px;object-fit:cover;border-radius:3px;flex:none;border:1px solid var(--line);background:#fff;margin-top:-7px;}
  .tasklist a.tel{color:var(--navy);font-family:var(--mono);font-weight:600;text-decoration:none;border-bottom:2px solid var(--gold);white-space:nowrap;}

  /* Inspections */
  .insp{border-top:1px solid var(--line);padding:14px 0;}
  .insp:first-of-type{border-top:none;}
  .insp .row1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .insp .it{font-family:var(--mono);font-weight:600;font-size:22px;color:var(--navy-dark);}
  .insp .ty{font-family:var(--head);font-weight:700;font-size:20px;color:var(--ink);}
  .insp .pm{margin-left:auto;font-family:var(--mono);font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:1px 8px;background:var(--page);}
  .insp .ia{margin-top:4px;font-size:17px;font-weight:600;}
  .insp .ip{margin-top:2px;font-size:16px;color:var(--gray);}
  .insp .in{margin-top:4px;font-size:16px;color:var(--ink);}
  .insp .acts .btn{font-size:17px;}
  .crewtag{display:inline-block;margin-top:6px;font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-dark);background:var(--page);border:1px solid var(--line);border-radius:3px;padding:2px 8px;}

  footer{padding:16px 0 32px;font-size:16px;color:var(--gray);}
  footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;}
  .err{background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:var(--r);padding:16px;font-size:17px;color:var(--ink);margin-top:16px;}
  [hidden]{display:none !important;}

  /* Print — the paper route sheet (Letter) */
  @page{size:Letter;margin:.5in;}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{background:#fff;font-size:12pt;}
    .wrap{max-width:none;padding:0;}
    .btns,.week,.tabs,.acts .btn,#sl-lockbtn{display:none !important;}
    #inspview{display:block !important;}
    #app{display:block !important;}
    .grid{display:block;}
    .panel{break-inside:avoid;border-color:#bbb;}
    .node,.insp{break-inside:avoid;}
    .chk:checked{background:#fff;border-color:var(--navy);}
    .chk:checked::after{content:none;}
    .off .txt{color:var(--ink);text-decoration:none;}
    .node.done .name{text-decoration:none;color:var(--ink);}
    .node.done .bd > *{opacity:1 !important;}
    .taskbanner{display:none !important;}
    .acts .lnk::after{content:" — " attr(href);font-weight:400;font-size:9pt;color:var(--gray);}
    .hero{border:none;}
  }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="https://sharmaelechvac.github.io/sharma-ar/assets/logo.png" onerror="this.onerror=null;this.src='logo.png'" alt="Sharma Electric &amp; HVAC" width="900" height="193">
  <div class="app">My Day<small id="updated"></small></div>
</div></header>

<section class="hero" id="hero" hidden><div class="wrap">
  <div class="hero-row">
    <div><div class="kicker" id="kicker">Today</div><h1 id="dsDate"></h1></div>
    <div class="btns"><button class="btn" type="button" onclick="window.print()">Print / PDF</button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="progress"><div class="bar"><i id="dsBar"></i></div><div class="txt" id="dsProg"></div></div>
  <nav class="week" id="weeknav" hidden></nav>
  <div class="tabs" id="tabs" hidden>
    <button class="tab on" id="tabDay" type="button">My Day</button>
    <button class="tab" id="tabInsp" type="button">Inspections<span class="cnt" id="inspCnt"></span></button>
  </div>
</div></section>

<main class="wrap">
  <div id="app"><div class="err" id="loading">Loading the day…</div></div>
  <div id="inspview" hidden></div>
</main>

<footer><div class="wrap">
  <div>Sharma Electric &amp; HVAC · <span class="mono">EC13013924 · CAC1823596</span></div>
  <div class="mono" id="updated2"></div>
</div></footer>

<script src="lock.js"></script>
<script>
const mapsDir = (dest, origin) => {
  let u = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest);
  if (origin) u += '&origin=' + encodeURIComponent(origin);
  return u;
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Phone numbers become tap-to-call links (text is escaped first). */
const PHONE = /(\(?\b\d{3}\)?[\s.-]?\d{3}[\s.-]\d{4}\b|\b1-\d{3}-\d{3}-\d{4}\b)/g;
const telify = s => esc(s).replace(PHONE, m => '<a class="tel" href="tel:' + m.replace(/\D/g, '') + '">' + m + '</a>');
const phoneOf = s => { const m = String(s || '').match(PHONE); return m ? m[0] : null; };
const matHTML = m => {
  const q = /\(([^)]*)\)\s*$/.exec(m);
  if (q) return esc(m.slice(0, q.index)) + '<span class="cnt">(' + esc(q[1]) + ')</span>';
  return esc(m);
};
const MATPH = {
  'Siemens meter combos (3)': 'mat/siemens.jpg', 'Siemens meter main combo': 'mat/siemens.jpg',
  'Grounding bridges (3)': 'mat/bridge.jpg', 'Intersystem grounding bridge': 'mat/bridge.jpg',
  'Bell boxes': 'mat/bellbox.jpg', '½-in PVC (2 sticks)': 'mat/pvc.jpg', '½-in PVC for the ground run': 'mat/pvc.jpg',
  '½-in male adapters': 'mat/adapter.jpg', 'Male adapters, locknuts & bushings': 'mat/locknut.jpg',
  '¾-in PVC': 'mat/pvc.jpg', '¾-in 90s': 'mat/elbow.jpg', '¾-in plastic Romex connectors': 'mat/romex.jpg',
  'THHN or stripped Romex — 12 AWG copper': 'mat/wire-cu.jpg', 'THHN or stripped Romex — 10 AWG CCA': 'mat/wire-cca.jpg',
  'PVC cement': 'mat/cement.jpg', 'Pull string': 'mat/pullstring.jpg', 'Stub-up cap / protection': 'mat/cap.jpg',
  'Mineralac straps (2 min)': 'mat/mineralac.jpg', 'Mineralac straps': 'mat/mineralac.jpg', 'GFCI outlet + breaker': 'mat/gfci.jpg',
  'Extra-duty while-in-use (bubble) cover': 'mat/bubble.jpg', 'Straps': 'mat/strap.jpg'
};
const matImg = m => MATPH[m] ? '<img class="matph" src="' + MATPH[m] + '" alt="">' : '';
const brandFor = s => {
  const who = s.who || '', addr = s.address || '', title = s.title || '';
  if (/city electric/i.test(title + ' ' + addr)) return { logo: 'logos/ces.png', alt: 'City Electric Supply' };
  if (/EXJ Root/i.test(who)) {
    const house = ['14065', '16321', '17385', '212', '601'].find(n => addr.includes(n));
    return { logo: 'logos/exj.png', alt: 'EXJ Root', link: 'https://sharmaelechvac.github.io/exj-root-tracker/' + (house ? house + '/' : '') };
  }
  if (/Z Brothers/i.test(who)) {
    const house = ['3131', '3262', '3274', '3286'].find(n => addr.includes(n));
    return { logo: 'logos/zbros.png', alt: 'Z Brothers Construction', link: 'https://sharmaelechvac.github.io/sharmatrack-crew/' + (house ? house + '/' : '') };
  }
  if (/BR Ross/i.test(who)) return { badge: 'BR ROSS' };
  return null;
};
const timeHTML = t => { const m = /^(.*?)\s*(AM|PM)$/i.exec(t || ''); return m ? esc(m[1]) + '<span style="font-size:13px"> ' + m[2].toUpperCase() + '</span>' : esc(t || ''); };
/* A stop needs a purpose/contact when it has no "who" and no real note (a bare "After ..." is just sequencing). */
const needsPurpose = s => !s.purpose && !s.who && (!s.note || /^\s*after\b/i.test(s.note));

const DAYPARAM = new URLSearchParams(location.search).get('day');

window.SharmaLock.load('day.enc.json', { appName: 'Sharma My Day', logo: 'https://sharmaelechvac.github.io/sharma-ar/assets/logo.png', blurb: 'Enter the office code to see your day.' }).then(bundle => {
  const isLive = !DAYPARAM || !bundle.days || !bundle.days[DAYPARAM] || DAYPARAM === (bundle.index || {}).liveDate;
  const raw = isLive ? bundle.live : bundle.days[DAYPARAM];
  if (DAYPARAM && !isLive && !raw) throw new Error('no day');
  const d = raw.data || raw;
  const tasksObj = raw.tasks || null;
  render(d, tasksObj, bundle.index, isLive);
}).catch(err => {
  document.getElementById('app').innerHTML = '<div class="err">Could not load the day. ' + esc(err && err.message ? err.message : '') + ' Check your connection and refresh.</div>';
});

function render(d, tasksObj, idx, isLive) {
  const stops = d.stops || [];
  const insps = d.inspections || [];
  const totalDrive = stops.reduce((a, s) => a + (s.driveFromPrev || 0), 0);
  const lsGet = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const doneSet = new Set(lsGet('myday-' + d.date + '-done', []));
  const checkSet = new Set(lsGet('myday-' + d.date + '-check', []));
  const doneCount = () => stops.filter((_, i) => doneSet.has(i)).length;
  const nextIdx = () => stops.findIndex((_, i) => !doneSet.has(i));

  /* Office tasks: hide any task that repeats an inspection (same permit #) — it lives in Inspections. */
  const permits = insps.map(x => String(x.permit || '').replace(/^#/, '')).filter(Boolean);
  const tasks = (tasksObj && tasksObj.date === d.date && tasksObj.tasks ? tasksObj.tasks : [])
    .filter(x => !permits.some(p => String(x.text || '').includes(p)));
  const openTasks = () => tasks.filter(x => !checkSet.has('task|' + x.text)).length;

  /* Hero */
  document.getElementById('kicker').textContent = isLive ? 'My Day' : 'Saved day';
  document.getElementById('dsDate').textContent = d.dayLabel || d.date || '';
  const unknownLegs = stops.filter((s, i) => s.driveFromPrev == null && (i > 0 || d.start)).length;
  const firstStart = stops[0] ? stops[0].start : '—';
  const paintStats = () => {
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="n">' + stops.length + '</div><div class="l">Stops</div></div>' +
      '<div class="stat"><div class="n">' + insps.length + '</div><div class="l">Inspections</div></div>' +
      '<div class="stat"><div class="n">' + totalDrive + '<small>min</small></div><div class="l">Driving' + (unknownLegs ? ' (+' + unknownLegs + ' leg?)' : '') + '</div></div>' +
      '<div class="stat"><div class="n">' + openTasks() + '<small>/' + tasks.length + '</small></div><div class="l">Tasks open</div></div>' +
      '<div class="stat"><div class="n">' + esc(firstStart) + '</div><div class="l">First stop</div></div>';
  };
  const paintStrip = () => {
    const nx = nextIdx();
    document.getElementById('dsProg').textContent = stops.length ? (nx >= 0 ? 'Stop ' + (nx + 1) + ' of ' + stops.length : 'Day complete') : 'No stops';
    document.getElementById('dsBar').style.width = stops.length ? (doneCount() / stops.length * 100) + '%' : '0%';
    paintStats();
  };
  document.getElementById('hero').hidden = false;
  if (d.updatedAt) {
    const t = new Date(String(d.updatedAt).replace(' ', 'T'));
    const s = isNaN(t) ? String(d.updatedAt) : t.toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    document.getElementById('updated').textContent = 'Updated ' + s;
    document.getElementById('updated2').textContent = 'Updated ' + s + ' ET';
  }

  /* Week picker — Mon–Sun of the shown day; live day has no param, saved days use ?day= */
  if (idx && idx.days) {
    const archived = new Set(idx.days.map(x => x.date));
    const liveDate = idx.liveDate;
    const cur = new Date(d.date + 'T00:00:00');
    const monday = new Date(cur); monday.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
    const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    let nh = '';
    for (let k = 0; k < 7; k++) {
      const dt = new Date(monday); dt.setDate(monday.getDate() + k);
      const iso = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
      const inner = '<span class="dn">' + names[k] + '</span><span class="dd">' + dt.getDate() + '</span>';
      if (iso === d.date) nh += '<span class="chip on" aria-current="date">' + inner + '</span>';
      else if (iso === liveDate) nh += '<a class="chip" href="./">' + inner + '</a>';
      else if (archived.has(iso)) nh += '<a class="chip" href="?day=' + iso + '">' + inner + '</a>';
      else nh += '<span class="chip off">' + inner + '</span>';
    }
    const nav = document.getElementById('weeknav');
    nav.innerHTML = nh; nav.hidden = false;
  }

  /* Inspections tab */
  if (insps.length) {
    let ih = '<div class="panel"><h2>Inspections<span class="sub">' + insps.length + ' today</span></h2>';
    insps.forEach(x => {
      const ph = phoneOf(x.contact);
      const crew = /crew covers/i.test(x.note || '');
      ih += '<div class="insp"><div class="row1"><span class="it">' + esc(x.time || '') + '</span><span class="ty">' + esc(x.type || '') + '</span>' +
            (x.permit ? '<span class="pm">#' + esc(String(x.permit).replace(/^#/, '')) + '</span>' : '') + '</div>' +
            '<div class="ia">' + esc(x.address || '') + '</div>' +
            '<div class="ip">' + esc(x.inspector ? 'Inspector ' + x.inspector : '') + (x.contact ? ' · ' + telify(x.contact) : '') + '</div>' +
            (x.note ? '<div class="in">' + esc(x.note) + '</div>' : '') +
            (crew ? '<span class="crewtag">Crew covers</span>' : '') +
            '<div class="acts">' + (x.address ? '<a class="btn" href="' + mapsDir(x.address) + '">Navigate</a>' : '') +
            (ph ? '<a class="btn" href="tel:' + ph.replace(/\D/g, '') + '">Call</a>' : '') + '</div></div>';
    });
    ih += '</div>';
    const inspView = document.getElementById('inspview');
    inspView.innerHTML = ih;
    document.getElementById('inspCnt').textContent = insps.length;
    document.getElementById('tabs').hidden = false;
    const appEl = document.getElementById('app');
    const tabDay = document.getElementById('tabDay'), tabInsp = document.getElementById('tabInsp');
    const showInsp = v => { inspView.hidden = !v; appEl.hidden = v; tabDay.classList.toggle('on', !v); tabInsp.classList.toggle('on', v); };
    tabDay.addEventListener('click', () => showInsp(false));
    tabInsp.addEventListener('click', () => showInsp(true));
  }

  /* Route timeline */
  let r = '<div class="panel"><h2>Route<span class="sub">' + totalDrive + ' min driving</span></h2><div class="tl">';
  if (d.start) {
    r += '<div class="node start first' + (stops.length ? '' : ' last') + '"><div class="tm"><div class="t">Start</div></div><div class="rail"></div><div class="bd">' +
         '<div class="ttl"><div class="name">Home</div></div><div class="addr">' + esc(d.start) + '</div>' +
         (stops.length ? '<div class="acts"><a class="btn solid" href="' + mapsDir(stops[0].address, d.start) + '">Navigate</a></div>' : '') + '</div></div>';
  }
  stops.forEach((s, i) => {
    if (i > 0 || d.start) {
      r += '<div class="leg"><div></div><div class="rail"></div>' + (s.driveFromPrev ? '<div class="dv"><b>' + s.driveFromPrev + ' min</b> drive</div>' : '<div class="dv unk">drive time not set</div>') + '</div>';
    }
    const isDone = doneSet.has(i), isNext = i === nextIdx();
    const cls = 'node' + (i === 0 && !d.start ? ' first' : '') + (i === stops.length - 1 ? ' last' : '') + (isNext ? ' next' : '') + (isDone ? ' done' : '');
    const street = (s.address || '').split(',')[0];
    const rest = (s.address || '').split(',').slice(1).join(',').trim();
    const name = (s.title || '').includes(' — ') ? s.title.split(' — ')[0] : (s.title || street);
    const job = (s.title || '').includes(' — ') ? s.title.split(' — ')[1] : '';
    const icon = /TUG/i.test(s.title) ? 'icons/tug.png' : /underground/i.test(s.title) ? 'icons/underground.png' : /walk/i.test(s.title) ? 'icons/walk.png' : null;
    const banner = icon ? icon.replace('.png', '-banner.png') : null;
    r += '<div class="' + cls + '" id="stop-' + i + '"><div class="tm"><div class="t">' + timeHTML(s.start) + '</div><div class="e">' + esc(s.end || '') + '</div></div><div class="rail"></div><div class="bd">';
    if (banner) r += '<img class="taskbanner" src="' + banner + '" alt="">';
    r += '<div class="ttl"><label class="ck stopck" title="Mark done"><input type="checkbox" class="chk" data-done="' + i + '"' + (isDone ? ' checked' : '') + ' aria-label="Done"></label>' +
         (icon ? '<img class="taskicon" src="' + icon + '" alt="">' : '') + '<div class="name">' + esc(name) + '</div></div>';
    r += '<div class="addr">' + esc(s.address || '') + '</div>';
    if (job) r += '<div class="job">' + esc(job) + '</div>';
    if (s.who) r += '<div class="meta"><b>' + esc(s.who) + '</b></div>';
    if (s.purpose) r += '<div class="meta">' + telify(s.purpose) + '</div>';
    if (s.note) r += '<div class="meta">' + telify(s.note) + '</div>';
    if (needsPurpose(s)) r += '<div class="flag">Purpose / contact not set</div>';
    if (s.address && s.who && (s.livingSf != null || s.underRoofSf != null || s.livingSF != null || s.underRoofSF != null)) {
      const v = x => (x === null || x === undefined || x === '') ? 'not on file' : (typeof x === 'number' ? x.toLocaleString('en-US') : esc(String(x)));
      r += '<div class="sf">Living ' + v(s.livingSf ?? s.livingSF) + ' sf · Under roof ' + v(s.underRoofSf ?? s.underRoofSF) + ' sf</div>';
    }
    const b = brandFor(s);
    const jobUrl = s.trackUrl || (b && b.link);
    r += '<div class="acts"><a class="btn' + (isNext ? ' solid' : '') + '" href="' + mapsDir(s.address) + '"' + (isDone ? ' hidden' : '') + '>Navigate</a>' +
         (jobUrl ? '<a class="lnk" href="' + esc(jobUrl) + '">SHARMATRACK job page</a>' : '') + '</div>';
    if (b) r += '<div class="brand">' + (b.logo ? '<img src="' + b.logo + '" alt="' + esc(b.alt) + '">' : '<span class="bbadge">' + esc(b.badge) + '</span>') + '</div>';
    const mats = s.materials || [];
    if (mats.length) {
      r += '<div class="mats"><div class="mlabel">Materials</div><ul class="list">';
      mats.forEach(m => {
        const id = 's' + i + '|' + m;
        r += '<li' + (checkSet.has(id) ? ' class="off"' : '') + '><label class="ck"><input type="checkbox" class="chk" data-check="' + esc(id) + '"' +
             (checkSet.has(id) ? ' checked' : '') + '>' + matImg(m) + '<span class="txt">' + matHTML(m) + '</span></label></li>';
      });
      r += '</ul></div>';
    }
    r += '</div></div>';
  });
  if (!stops.length) r += '<div class="meta" style="padding:12px 0">No stops on the route.</div>';
  r += '</div></div>';

  /* Load the truck */
  const loadMap = new Map();
  stops.forEach(s => (s.materials || []).forEach(m => loadMap.set(m, (loadMap.get(m) || 0) + 1)));
  const load = [...loadMap.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  let side = '';
  if (tasks.length) {
    side += '<div class="panel"><h2>Office Tasks<span class="sub" id="taskSub"></span></h2><ul class="list tasklist">';
    tasks.forEach(x => {
      const id = 'task|' + x.text;
      side += '<li' + (checkSet.has(id) ? ' class="off"' : '') + '><label class="ck"><input type="checkbox" class="chk" data-check="' + esc(id) + '"' +
              (checkSet.has(id) ? ' checked' : '') + '><span class="txt">' + telify(x.text) + '</span></label></li>';
    });
    side += '</ul></div>';
  }
  if (load.length) {
    side += '<div class="panel"><h2>Load the Truck</h2><ul class="list">';
    load.forEach(([nm, n]) => {
      const id = 'load|' + nm;
      side += '<li' + (checkSet.has(id) ? ' class="off"' : '') + '><label class="ck"><input type="checkbox" class="chk" data-check="' + esc(id) + '"' +
              (checkSet.has(id) ? ' checked' : '') + '>' + matImg(nm) + '<span class="txt">' + esc(nm) + '</span>' + (n > 1 ? '<span class="cnt">×' + n + '</span>' : '') + '</label></li>';
    });
    side += '</ul></div>';
  }

  const app = document.getElementById('app');
  app.innerHTML = '<div class="grid"><div>' + r + '</div><div>' + side + '</div></div>';
  const paintTaskSub = () => { const el = document.getElementById('taskSub'); if (el) el.textContent = openTasks() + ' open'; };
  paintTaskSub();

  const paintDay = () => {
    const nx = nextIdx();
    stops.forEach((_, i) => {
      const el = document.getElementById('stop-' + i);
      if (!el) return;
      el.classList.toggle('done', doneSet.has(i));
      el.classList.toggle('next', i === nx);
      const nav = el.querySelector('.acts .btn');
      if (nav) { nav.hidden = doneSet.has(i); nav.classList.toggle('solid', i === nx); }
    });
    paintStrip();
  };
  paintStrip();

  app.addEventListener('change', e => {
    const cb = e.target;
    if (cb.matches('input[data-check]')) {
      /* Same material ticks together everywhere; tasks tick on their own text */
      const key = cb.dataset.check.split('|').slice(1).join('|');
      const kind = cb.dataset.check.split('|')[0];
      app.querySelectorAll('input[data-check]').forEach(o => {
        const ok = o.dataset.check.split('|')[0];
        const same = o.dataset.check.split('|').slice(1).join('|') === key && ((kind === 'task') === (ok === 'task'));
        if (same) {
          o.checked = cb.checked;
          const li = o.closest('li');
          if (li) li.classList.toggle('off', cb.checked);
          if (cb.checked) checkSet.add(o.dataset.check); else checkSet.delete(o.dataset.check);
        }
      });
      lsSet('myday-' + d.date + '-check', [...checkSet]);
      paintTaskSub(); paintStats();
    }
    if (cb.matches('input[data-done]')) {
      const i = +cb.dataset.done;
      if (cb.checked) doneSet.add(i); else doneSet.delete(i);
      lsSet('myday-' + d.date + '-done', [...doneSet]);
      paintDay();
    }
  });
}
</script>
</body>
</html>
