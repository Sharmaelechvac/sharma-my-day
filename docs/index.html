<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>My Day — Sharma Electric &amp; HVAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#264387; --navy-dark:#1a2f61; --gold:#F0A846;
    --ink:#1d2433; --gray:#5b6478; --line:#dfe4ee; --page:#f4f6fb;
    --radius:5px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--page);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.4;}
  .sheet{background:#fff;max-width:880px;margin:0 auto;min-height:100vh;}
  @media (min-width:900px){ .sheet{border-left:1px solid var(--line);border-right:1px solid var(--line);} }

  /* Header */
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--gold);background:#fff;}
  header img{height:40px;width:auto;display:block;}
  header .wordmark{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:20px;color:var(--navy-dark);letter-spacing:.01em;line-height:1;}
  header .sub{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gray);text-align:right;}

  main{padding:20px 16px 8px;}

  /* Day heading */
  h1{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:25px;line-height:28px;color:var(--navy-dark);}
  .summary{margin-top:4px;font-size:13px;color:var(--gray);}
  .summary .n{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--navy);font-weight:500;}

  /* Section heading + label */
  h2{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:20px;line-height:24px;color:var(--navy-dark);border-bottom:2px solid var(--gold);padding-bottom:6px;}
  .label{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--navy);}
  section{margin-top:24px;}
  section:first-of-type{margin-top:20px;}

  /* Start block */
  .start-row{display:flex;align-items:center;gap:12px;padding-top:8px;}
  .start-row .addr{font-size:16px;line-height:22px;font-weight:500;flex:1;min-width:0;}
  .start-note{margin-top:4px;font-size:13px;color:var(--gray);}

  /* Buttons */
  .nav-btn{display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:116px;padding:0 16px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;text-decoration:none;border-radius:var(--radius);flex:none;}
  .nav-btn:active{background:var(--navy-dark);}

  /* Load the truck */
  .load-list{list-style:none;margin-top:8px;}
  .load-list li{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;line-height:20px;padding:3px 0;border-bottom:1px solid var(--line);}
  .load-list li:last-child{border-bottom:none;}
  .load-list .cnt{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gray);flex:none;}
  @media (min-width:640px){ .load-list{columns:2;column-gap:32px;} .load-list li{break-inside:avoid;} }

  /* Timeline */
  .tl{margin-top:4px;}
  .stop{display:grid;grid-template-columns:56px 18px 1fr;}
  .stop .time{padding-top:13px;text-align:right;font-family:'IBM Plex Mono',monospace;}
  .stop .time .t{font-size:13px;font-weight:600;color:var(--navy);line-height:16px;white-space:nowrap;}
  .stop .time .e{font-size:11.5px;color:var(--gray);line-height:15px;white-space:nowrap;}
  .rail{position:relative;}
  .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);transform:translateX(-0.5px);}
  .rail::after{content:"";position:absolute;left:50%;top:17px;width:8px;height:8px;background:var(--navy);transform:translateX(-50%);}
  .stop.first .rail::before{top:21px;}
  .stop.last .rail::before{bottom:auto;height:21px;}
  .leg{display:grid;grid-template-columns:56px 18px 1fr;}
  .leg .rail::after{display:none;}
  .leg .drive{padding:1px 0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gray);white-space:nowrap;}
  .stop .body{padding:12px 0 16px 10px;border-bottom:1px solid var(--line);}
  .stop.last .body{border-bottom:none;}
  .stop.first .body{border-left:3px solid var(--gold);padding-left:7px;}
  .title-row{display:flex;align-items:flex-start;gap:12px;}
  .stop h3{font-size:16px;line-height:22px;font-weight:600;color:var(--ink);flex:1;min-width:0;}
  .stop.first h3{font-weight:700;}
  .stop .who{margin-top:2px;font-size:14.5px;line-height:20px;color:var(--gray);}
  .stop .addr{margin-top:2px;font-size:16px;line-height:22px;}
  .stop .note{margin-top:4px;font-size:13px;line-height:18px;color:var(--gray);}

  /* Materials */
  details.mats{margin-top:8px;border-top:1px solid var(--line);}
  details.mats summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:15px;font-weight:500;color:var(--navy);}
  details.mats summary::-webkit-details-marker{display:none;}
  details.mats summary .cnt{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gray);font-weight:400;}
  details.mats summary .chev{margin-left:auto;font-size:13px;color:var(--gray);}
  details.mats ul{list-style:none;padding-bottom:8px;}
  details.mats li{font-size:15px;line-height:21px;padding:2px 0 2px 14px;position:relative;}
  details.mats li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;background:var(--gold);}

  footer{margin-top:24px;padding:12px 16px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--gray);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  footer .mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .err{padding:24px 16px;font-size:16px;color:var(--gray);}
</style>
</head>
<body>
<div class="sheet">
  <header>
    <img src="logo.png" alt="Sharma Electric &amp; HVAC">
    <div class="wordmark">My Day</div>
    <div class="sub" id="hdrDate"></div>
  </header>
  <main id="app"><div class="err">Loading the day…</div></main>
  <footer>
    <div>Sharma Electric &amp; HVAC · EC13013924 · CAC1823596</div>
    <div class="mono" id="updated"></div>
  </footer>
</div>
<script>
const mapsDir = (dest, origin) => {
  let u = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest);
  if (origin) u += '&origin=' + encodeURIComponent(origin);
  return u;
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('data.json', {cache:'no-store'}).then(r => r.json()).then(d => {
  document.getElementById('hdrDate').textContent = d.dayLabel || '';
  const stops = d.stops || [];
  const totalDrive = stops.reduce((a, s) => a + (s.driveFromPrev || 0), 0);
  const loadMap = new Map();
  stops.forEach(s => (s.materials || []).forEach(m => loadMap.set(m, (loadMap.get(m) || 0) + 1)));
  const load = [...loadMap.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  let h = '';
  h += '<h1>' + esc(d.dayLabel || 'My Day') + '</h1>';
  h += '<div class="summary"><span class="n">' + stops.length + '</span> stops · <span class="n">' + totalDrive + ' min</span> driving' +
       (stops.length ? ' · first stop <span class="n">' + esc(stops[0].start) + '</span>' : '') + '</div>';

  if (d.start) {
    h += '<section><div class="label">Start</div><div class="start-row"><div class="addr">' + esc(d.start) + '</div>' +
         (stops.length ? '<a class="nav-btn" href="' + mapsDir(stops[0].address, d.start) + '">Navigate</a>' : '') +
         '</div><div class="start-note">First leg: home to ' + esc(stops[0] ? stops[0].title : '') + '</div></section>';
  }

  if (load.length) {
    h += '<section><h2>Load the Truck</h2><ul class="load-list">';
    load.forEach(([name, n]) => { h += '<li><span>' + esc(name) + '</span>' + (n > 1 ? '<span class="cnt">×' + n + '</span>' : '') + '</li>'; });
    h += '</ul></section>';
  }

  h += '<section><h2>Route</h2><div class="tl">';
  stops.forEach((s, i) => {
    if (s.driveFromPrev) {
      h += '<div class="leg"><div class="drive">' + s.driveFromPrev + ' min</div><div class="rail"></div><div></div></div>';
    }
    const cls = 'stop' + (i === 0 ? ' first' : '') + (i === stops.length - 1 ? ' last' : '');
    h += '<div class="' + cls + '">';
    h += '<div class="time"><div class="t">' + esc(s.start) + '</div><div class="e">' + esc(s.end || '') + '</div></div>';
    h += '<div class="rail"></div>';
    h += '<div class="body">';
    h += '<div class="title-row"><h3>' + esc(s.title) + '</h3><a class="nav-btn" href="' + mapsDir(s.address) + '">Navigate</a></div>';
    if (s.who) h += '<div class="who">' + esc(s.who) + '</div>';
    h += '<div class="addr">' + esc(s.address) + '</div>';
    if (s.note) h += '<div class="note">' + esc(s.note) + '</div>';
    const mats = s.materials || [];
    if (mats.length) {
      h += '<details class="mats"><summary>Materials <span class="cnt">' + mats.length + ' items</span><span class="chev">▾</span></summary><ul>';
      mats.forEach(m => { h += '<li>' + esc(m) + '</li>'; });
      h += '</ul></details>';
    }
    h += '</div></div>';
  });
  h += '</div></section>';

  document.getElementById('app').innerHTML = h;
  if (d.updatedAt) {
    const t = new Date(d.updatedAt);
    document.getElementById('updated').textContent = 'Updated ' + t.toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
  }
}).catch(() => {
  document.getElementById('app').innerHTML = '<div class="err">Could not load the day. Check your connection and refresh.</div>';
});
</script>
</body>
</html>
