<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My Day — Sharma Electric & HVAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#264387; --dnavy:#1a2f61; --gold:#F0A846;
    --ink:#1d2433; --gray:#5b6478; --line:#dfe4ee; --bg:#f4f6fb;
    --r:4px; --r2:6px;
    --head:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
    --body:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;
    --mono:'IBM Plex Mono',Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;}
  a{color:var(--navy);}
  b{font-weight:600;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .muted{color:var(--gray);}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px;}
  [hidden]{display:none !important;}

  /* Header: white, real logo, 3px gold line */
  header.top{background:#fff;border-bottom:3px solid var(--gold);}
  header.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px;padding-top:10px;padding-bottom:10px;}
  header.top img{height:40px;width:auto;max-width:44vw;display:block;}
  header.top .t{border-left:1px solid var(--line);padding-left:14px;min-width:0;}
  header.top h1{font:700 24px/1 var(--head);color:var(--dnavy);text-transform:uppercase;letter-spacing:.03em;}
  header.top .d{font-size:15px;line-height:1.25;color:var(--gray);margin-top:3px;}
  @media (max-width:699px){ header.top img{height:32px;} header.top .t{padding-left:12px;} header.top h1{font-size:22px;} }
  @media (min-width:700px){ header.top img{height:52px;} header.top h1{font-size:28px;} header.top .d{font-size:16px;} }

  main{padding:16px 0 8px;}

  /* Week picker */
  .days-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:2px 6px;margin-bottom:14px;}
  .days{display:flex;}
  .days > *{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gray);text-decoration:none;font-size:15px;border-bottom:3px solid transparent;line-height:1.2;}
  .days .n{font-family:var(--mono);font-size:16px;font-weight:500;}
  .days a{color:var(--navy);}
  .days a .dn{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
  .days .on{color:var(--dnavy);font-weight:600;border-bottom-color:var(--gold);}
  .days .on .n{font-weight:600;}
  .days .off{color:#9aa2b3;}

  /* Masthead */
  .mast{text-align:center;background:#fff;border:1px solid var(--line);border-bottom:3px solid var(--dnavy);border-radius:var(--r2) var(--r2) 0 0;padding:14px 16px 12px;}
  .mast .paper{font:700 14px/1 var(--head);letter-spacing:.18em;color:var(--gray);text-transform:uppercase;}
  .mast .title{font:700 48px/.95 var(--head);margin:8px 0 6px;letter-spacing:.02em;color:var(--dnavy);text-transform:uppercase;}
  .mast .rule{height:2px;background:var(--gold);margin:8px 0;}
  .mast .dateline{font:500 13px/1.5 var(--mono);color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:1px;text-transform:uppercase;letter-spacing:.02em;}
  .mast .dateline .ed{color:var(--dnavy);font-weight:600;}
  @media (min-width:900px){ .mast .title{font-size:64px;} .mast .dateline{font-size:14px;} }

  /* Lead story = first stop */
  .lead{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r2) var(--r2);padding:16px;}
  .kicker{font:700 13px/1 var(--head);color:var(--gold);text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px;}
  .lead h2{font:700 32px/1.05 var(--head);color:var(--dnavy);margin:0 0 8px;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere;}
  .lead .deck{font-size:18px;line-height:1.45;color:var(--ink);margin:0 0 4px;}
  .lead .who{font-size:16px;color:var(--ink);margin-top:4px;}
  @media (min-width:900px){ .lead{padding:20px 24px;} .lead h2{font-size:40px;} .lead .deck{font-size:19px;max-width:860px;} }

  .fact{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:16px;}
  .fact .k{font:600 14px/1.5 var(--mono);color:var(--dnavy);white-space:nowrap;}
  .fact .k small{display:block;font-size:12px;font-weight:500;color:var(--gray);}
  .fact > div:last-child{min-width:0;}
  .lead .fact{margin-top:14px;}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:0 18px;border:1px solid var(--navy);border-radius:var(--r2);background:#fff;color:var(--navy);font:600 16px/1 var(--body);text-decoration:none;cursor:pointer;white-space:nowrap;}
  .btn.solid{background:var(--navy);color:#fff;}
  .btn:active{background:var(--dnavy);border-color:var(--dnavy);color:#fff;}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .navrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;}
  .lnk{font-size:16px;font-weight:600;color:var(--navy);text-decoration:none;border-bottom:2px solid var(--gold);padding:12px 0 2px;}
  .tel{color:var(--navy);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap;}

  /* Flags and tags */
  .flag{display:inline-block;margin-top:6px;padding:4px 10px;border:1px solid var(--gold);border-left:6px solid var(--gold);border-radius:var(--r);background:#fff;color:var(--dnavy);font-weight:600;font-size:15px;}
  .crew{display:inline-flex;align-items:center;min-height:32px;font-size:15px;color:var(--gray);border:1px solid var(--line);border-radius:var(--r);padding:2px 8px;background:var(--bg);}

  /* The three columns */
  .brief-grid{display:grid;gap:0;}
  .col{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px 6px;margin-top:14px;min-width:0;}
  .col > h3{font:700 20px/1.1 var(--head);color:var(--dnavy);text-transform:uppercase;letter-spacing:.04em;padding-bottom:6px;border-bottom:2px solid var(--gold);margin:4px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .col > h3 small{font:500 15px var(--body);color:var(--gray);text-transform:none;letter-spacing:0;}
  .col > h3.sub2{margin-top:22px;}
  @media (min-width:900px){
    .brief-grid{grid-template-columns:1.3fr .95fr .95fr;gap:24px;margin-top:16px;padding-top:4px;}
    .col{background:none;border:0;border-radius:0;padding:0;margin-top:0;}
    .col + .col{border-left:1px solid var(--line);padding-left:24px;}
    .col > h3{font-size:19px;}
  }

  /* The run */
  .stop .nm{display:flex;align-items:flex-start;gap:10px;}
  .stop .nm b{font:700 19px/1.2 var(--head);color:var(--ink);flex:1;min-width:0;}
  .stop .addr{color:var(--gray);}
  .stop .job{color:var(--navy);font-weight:600;}
  .stop .sf{font-family:var(--mono);font-size:14px;margin-top:4px;}
  .stop.next{box-shadow:inset 3px 0 0 var(--gold);padding-left:8px;margin-left:-8px;}
  .stop.done .nm b{text-decoration:line-through;color:var(--gray);}
  .stop.done > div:last-child > *:not(.nm){opacity:.6;}
  .nexttag{display:inline-block;font:600 11px/1 var(--mono);color:var(--dnavy);background:var(--gold);border-radius:3px;padding:3px 5px;margin-top:4px;letter-spacing:.04em;}
  .drive{font-family:var(--mono);font-size:15px;}
  .drive.unk{color:var(--gray);font-style:italic;}
  .taskicon{width:36px;height:36px;border-radius:var(--r);flex:none;display:block;}
  .taskbanner{display:none;width:100%;height:auto;border-radius:var(--r);margin:4px 0 8px;border:1px solid var(--line);}
  .stop.next .taskbanner{display:block;}
  .brand{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .brand img{height:28px;max-width:150px;object-fit:contain;display:block;}
  .bbadge{font:700 14px/1 var(--head);letter-spacing:.08em;color:var(--dnavy);border:1px solid var(--navy);border-radius:var(--r);padding:4px 8px;}
  .mlabel{font:700 14px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin-top:10px;padding-bottom:4px;border-bottom:1px solid var(--line);}

  /* Checklists */
  .list{list-style:none;}
  .list li{border-bottom:1px solid var(--line);}
  .list li:last-child{border-bottom:none;}
  .ck{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:11px 0;cursor:pointer;}
  .chk{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;background:#fff;border:2px solid var(--navy);border-radius:var(--r);cursor:pointer;position:relative;}
  .chk:checked{background:var(--gold);border-color:var(--gold);}
  .chk:checked::after{content:"";position:absolute;left:7.5px;top:3px;width:6px;height:12px;border:solid var(--dnavy);border-width:0 3px 3px 0;transform:rotate(42deg);}
  .chk:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .ck .txt{flex:1;min-width:0;padding-top:2px;}
  .off .txt,.off .more{color:var(--gray);text-decoration:line-through;}
  .ck .cnt{font-family:var(--mono);font-size:14px;color:var(--gray);flex:none;padding-top:3px;}
  .stopck{min-height:0;padding:0;margin-top:-2px;flex:none;}
  .matph{width:36px;height:36px;object-fit:cover;border-radius:3px;flex:none;border:1px solid var(--line);background:#fff;margin-top:-5px;}
  .mats .ck{min-height:44px;padding:9px 0;font-size:15px;}

  /* Desk tasks with a "+" for the long ones */
  .task{display:flex;align-items:flex-start;gap:4px;}
  .task .ck{flex:1;min-width:0;}
  .task .txt b{font-weight:600;}
  .task-li .more{display:none;font-size:15px;color:var(--gray);padding:0 0 12px 38px;}
  .task-li.open .more{display:block;}
  .plus{flex:none;width:44px;min-height:48px;border:0;background:none;color:var(--gray);font:500 20px/1 var(--mono);cursor:pointer;}
  .plus:focus-visible{outline:3px solid var(--gold);}

  /* Inspections */
  .insp{padding:12px 0;border-bottom:1px solid var(--line);}
  .insp:last-child{border-bottom:0;}
  .itime{font:600 16px var(--mono);color:var(--dnavy);}
  .insp .ty{font-weight:600;}
  .insp .navrow{margin-top:8px;gap:8px;}
  .insp .btn{padding:0 14px;}
  .tmeta{font:500 14px/1.5 var(--mono);color:var(--dnavy);margin-top:2px;}

  /* Utility bar and footer */
  .util{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);}
  .util .acts{display:flex;gap:8px;flex-wrap:wrap;}
  @media (min-width:700px){ .util{flex-direction:row;align-items:center;justify-content:space-between;} }
  footer{padding:10px 0 16px;font-size:15px;color:var(--gray);}
  footer .wrap{display:flex;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;}
  .err{background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:var(--r);padding:16px;font-size:16px;color:var(--ink);}

  /* Print — the paper edition (Letter) */
  @page{size:Letter;margin:.45in;}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{background:#fff;font-size:9.5pt;line-height:1.35;}
    .wrap{max-width:none;padding:0;}
    main{padding:6pt 0 0;}
    header.top{border-bottom-width:2pt;}
    header.top .wrap{min-height:0;padding:0 0 6pt;}
    header.top img{height:34pt;}
    header.top h1{font-size:18pt;}
    .days-wrap,.util .acts,.navrow .btn,.plus,#sl-lockbtn{display:none !important;}
    .navrow:not(:has(.lnk,.crew)){display:none;}
    .mast{border:0;border-bottom:2pt solid var(--dnavy);border-radius:0;padding:4pt 0 6pt;}
    .mast .title{font-size:34pt;margin:4pt 0;}
    .mast .rule{margin:4pt 0;}
    .mast .dateline{font-size:8.5pt;}
    .lead{border:0;border-radius:0;padding:8pt 0 4pt;}
    .lead h2{font-size:22pt;}
    .lead .deck{font-size:11pt;}
    .fact{grid-template-columns:62pt 1fr;padding:5pt 0;font-size:9.5pt;}
    .fact .k{font-size:8.5pt;}
    .brief-grid{grid-template-columns:1.3fr 1fr 1fr;gap:14pt;margin-top:6pt;border-top:1pt solid var(--line);padding-top:6pt;}
    .col{background:none;border:0;border-radius:0;padding:0;margin:0;}
    .col + .col{border-left:1pt solid var(--line);padding-left:12pt;}
    .col > h3{font-size:12pt;}
    .stop .nm b{font-size:11pt;}
    .fact,.insp,.task-li,.mats li{break-inside:avoid;}
    .ck{min-height:0;padding:4pt 0;gap:6pt;}
    .mats .ck{min-height:0;padding:3pt 0;font-size:9pt;}
    .chk{width:11pt;height:11pt;border-width:1pt;}
    .chk:checked{background:#fff;border-color:var(--navy);}
    .chk:checked::after{content:none;}
    .matph,.taskicon,.taskbanner{display:none !important;}
    .task-li .more{display:block !important;padding:0 0 4pt 17pt;font-size:8.5pt;}
    .off .txt,.off .more,.stop.done .nm b{color:var(--ink);text-decoration:none;}
    .stop.done > div:last-child > *{opacity:1 !important;}
    .stop.next{box-shadow:none;padding-left:0;margin-left:0;}
    .nexttag{display:none;}
    .lnk{padding:0;font-size:8.5pt;}
    .lnk::after{content:" — " attr(href);font-weight:400;font-size:7.5pt;color:var(--gray);}
    .itime{font-size:10pt;}
    .drive,.tmeta,.sf{font-size:8.5pt;}
    .mlabel{font-size:8pt;margin-top:4pt;}
    .flag{font-size:8.5pt;padding:1pt 5pt;}
    .crew{min-height:0;font-size:8pt;padding:0 4pt;}
    .util{margin-top:8pt;padding-top:6pt;font-size:8.5pt;}
    footer{padding:4pt 0 0;font-size:8pt;}
  }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="https://sharmaelechvac.github.io/sharma-ar/assets/logo.png" onerror="this.onerror=null;this.src='logo.png'" alt="Sharma Electric & HVAC" width="900" height="193">
  <div class="t"><h1>My Day</h1><div class="d" id="hdrDate">&nbsp;</div></div>
</div></header>

<main class="wrap">
  <nav class="days-wrap" id="weeknav" aria-label="Week" hidden><div class="days" id="days"></div></nav>
  <div id="app"><div class="err" id="loading">Loading the day…</div></div>
  <div class="util" id="util" hidden>
    <span class="mono muted" id="updated"></span>
    <div class="acts">
      <button class="btn" type="button" onclick="location.reload()">Refresh</button>
      <button class="btn" type="button" onclick="window.print()">Print / PDF</button>
    </div>
  </div>
</main>

<footer><div class="wrap">
  <div>Sharma Electric & HVAC · <span class="mono" style="white-space:nowrap">EC13013924 · CAC1823596</span></div>
</div></footer>

<script src="lock.js"></script>
<script>
const mapsDir = (dest, origin) => {
  let u = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest);
  if (origin) u += '&origin=' + encodeURIComponent(origin);
  return u;
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'\u0026amp;','<':'\u0026lt;','>':'\u0026gt;','"':'\u0026quot;'}[c]));
/* Phone numbers become tap-to-call links (text is escaped first). */
const PHONE = /(\(?\b\d{3}\)?[\s.-]?\d{3}[\s.-]\d{4}\b|\b1-\d{3}-\d{3}-\d{4}\b)/g;
const telify = s => esc(s).replace(PHONE, m => '<a class="tel" href="tel:' + m.replace(/\D/g, '') + '">' + m + '</a>');
const phoneOf = s => { const m = String(s || '').match(PHONE); return m ? m[0] : null; };
const matHTML = m => {
  const q = /\(([^)]*)\)\s*$/.exec(m);
  if (q) return esc(m.slice(0, q.index)) + '<span class="cnt">(' + esc(q[1]) + ')</span>';
  return esc(m);
};
const MATPH = {
  'Siemens meter combos (3)': 'mat/siemens.jpg', 'Siemens meter main combo': 'mat/siemens.jpg',
  'Grounding bridges (3)': 'mat/bridge.jpg', 'Intersystem grounding bridge': 'mat/bridge.jpg',
  'Bell boxes': 'mat/bellbox.jpg', '½-in PVC (2 sticks)': 'mat/pvc.jpg', '½-in PVC for the ground run': 'mat/pvc.jpg',
  '½-in male adapters': 'mat/adapter.jpg', 'Male adapters, locknuts & bushings': 'mat/locknut.jpg',
  '¾-in PVC': 'mat/pvc.jpg', '¾-in 90s': 'mat/elbow.jpg', '¾-in plastic Romex connectors': 'mat/romex.jpg',
  'THHN or stripped Romex — 12 AWG copper': 'mat/wire-cu.jpg', 'THHN or stripped Romex — 10 AWG CCA': 'mat/wire-cca.jpg',
  'PVC cement': 'mat/cement.jpg', 'Pull string': 'mat/pullstring.jpg', 'Stub-up cap / protection': 'mat/cap.jpg',
  'Mineralac straps (2 min)': 'mat/mineralac.jpg', 'Mineralac straps': 'mat/mineralac.jpg', 'GFCI outlet + breaker': 'mat/gfci.jpg',
  'Extra-duty while-in-use (bubble) cover': 'mat/bubble.jpg', 'Straps': 'mat/strap.jpg'
};
const matImg = m => MATPH[m] ? '<img class="matph" src="' + MATPH[m] + '" alt="">' : '';
const brandFor = s => {
  const who = s.who || '', addr = s.address || '', title = s.title || '';
  if (/city electric/i.test(title + ' ' + addr)) return { logo: 'logos/ces.png', alt: 'City Electric Supply' };
  if (/EXJ Root/i.test(who)) {
    const house = ['14065', '16321', '17385', '212', '601'].find(n => addr.includes(n));
    return { logo: 'logos/exj.png', alt: 'EXJ Root', link: 'https://sharmaelechvac.github.io/exj-root-tracker/' + (house ? house + '/' : '') };
  }
  if (/Z Brothers/i.test(who)) {
    const house = ['3131', '3262', '3274', '3286'].find(n => addr.includes(n));
    return { logo: 'logos/zbros.png', alt: 'Z Brothers Construction', link: 'https://sharmaelechvac.github.io/sharmatrack-crew/' + (house ? house + '/' : '') };
  }
  if (/BR Ross/i.test(who)) return { badge: 'BR ROSS' };
  return null;
};
const timeHTML = t => { const m = /^(.*?)\s*(AM|PM)$/i.exec(t || ''); return m ? esc(m[1]) + '<span style="font-size:13px"> ' + m[2].toUpperCase() + '</span>' : esc(t || ''); };
/* A stop needs a purpose/contact when it has no "who" and no real note (a bare "After ..." is just sequencing). */
const needsPurpose = s => !s.purpose && !s.who && (!s.note || /^\s*after\b/i.test(s.note));

const DAYPARAM = new URLSearchParams(location.search).get('day');
window.SharmaLock.load('day.enc.json', { appName: 'Sharma My Day', logo: 'https://sharmaelechvac.github.io/sharma-ar/assets/logo.png', blurb: 'Enter the office code to see your day.' }).then(bundle => {
  const isLive = !DAYPARAM || !bundle.days || !bundle.days[DAYPARAM] || DAYPARAM === (bundle.index || {}).liveDate;
  const raw = isLive ? bundle.live : bundle.days[DAYPARAM];
  if (DAYPARAM && !isLive && !raw) throw new Error('no day');
  const d = raw.data || raw;
  const tasksObj = raw.tasks || null;
  render(d, tasksObj, bundle.index, isLive);
}).catch(err => {
  document.getElementById('app').innerHTML = '<div class="err">Could not load the day. ' + esc(err && err.message ? err.message : '') + ' Check your connection and refresh.</div>';
});

/* Helpers for the brief */
const splitTitle = s => {
  const t = s.title || '', street = (s.address || '').split(',')[0].trim();
  const name = t.includes(' — ') ? t.split(' — ')[0] : (t || street);
  const job = t.includes(' — ') ? t.split(' — ').slice(1).join(' — ') : '';
  return { name, job, street };
};
const sentence = x => { x = String(x || '').trim(); if (!x) return ''; x = x.charAt(0).toUpperCase() + x.slice(1); return /[.!?]$/.test(x) ? x : x + '.'; };
const realNote = n => n && !/^\s*after\b/i.test(n);
const streetOf = a => String(a || '').split(',')[0].trim();
const cityOf = a => { const p = String(a || '').split(',').map(x => x.trim()).filter(Boolean); return p.length > 1 ? p[1] : ''; };
const callLabel = c => {
  const s = String(c || '').replace(PHONE, '').replace(/[·,\-–—\s]+$/,'').trim();
  if (!s) return 'Call';
  return 'Call ' + s.replace(/\bBuilding\s+/i, '');
};

function render(d, tasksObj, idx, isLive) {
  const stops = d.stops || [];
  const insps = d.inspections || [];
  const totalDrive = stops.reduce((a, s) => a + (s.driveFromPrev || 0), 0);
  const unknownLegs = stops.filter((s, i) => s.driveFromPrev == null && (i > 0 || d.start)).length;
  const lsGet = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const doneSet = new Set(lsGet('myday-' + d.date + '-done', []));
  const checkSet = new Set(lsGet('myday-' + d.date + '-check', []));
  const doneCount = () => stops.filter((_, i) => doneSet.has(i)).length;
  const nextIdx = () => stops.findIndex((_, i) => !doneSet.has(i));

  /* Office tasks: hide any task that repeats an inspection (same permit #) — it lives in Inspections. */
  const permits = insps.map(x => String(x.permit || '').replace(/^#/, '')).filter(Boolean);
  const tasks = (tasksObj && tasksObj.date === d.date && tasksObj.tasks ? tasksObj.tasks : [])
    .filter(x => !permits.some(p => String(x.text || '').includes(p)));
  const openTasks = () => tasks.filter(x => !checkSet.has('task|' + x.text)).length;

  const dt = new Date((d.date || '') + 'T12:00:00');
  const longDate = isNaN(dt) ? (d.dayLabel || d.date || '') : dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('hdrDate').textContent = (isLive ? '' : 'Saved day · ') + (d.dayLabel || longDate);

  if (d.updatedAt) {
    const t = new Date(String(d.updatedAt).replace(' ', 'T'));
    const s = isNaN(t) ? String(d.updatedAt) : t.toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    document.getElementById('updated').textContent = 'Updated ' + s + ' ET';
  }
  document.getElementById('util').hidden = false;

  /* Week picker — Mon–Sun of the shown day; live day has no param, saved days use ?day= */
  if (idx && idx.days) {
    const archived = new Set(idx.days.map(x => x.date));
    const liveDate = idx.liveDate;
    const cur = new Date(d.date + 'T00:00:00');
    const monday = new Date(cur); monday.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
    const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    let nh = '';
    for (let k = 0; k < 7; k++) {
      const x = new Date(monday); x.setDate(monday.getDate() + k);
      const iso = x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
      const inner = '<span class="dn">' + names[k] + '</span><span class="n">' + x.getDate() + '</span>';
      if (iso === d.date) nh += '<span class="on" aria-current="date">' + inner + '</span>';
      else if (iso === liveDate) nh += '<a href="./">' + inner + '</a>';
      else if (archived.has(iso)) nh += '<a href="?day=' + iso + '">' + inner + '</a>';
      else nh += '<span class="off">' + inner + '</span>';
    }
    document.getElementById('days').innerHTML = nh;
    document.getElementById('weeknav').hidden = false;
  }

  /* Masthead */
  const city = cityOf(d.start);
  let h = '<header class="mast"><div class="paper">Sharma Electric & HVAC</div><div class="title">The Day</div><div class="rule"></div>' +
          '<div class="dateline"><span>' + (city ? esc(city) + ' · ' : '') + esc(longDate) + '</span>' +
          '<span id="counts"></span>' +
          '<span id="drivect"></span>' +
          '<span class="ed" id="edition"></span></div></header>';

  /* Lead story — the first stop of the loaded day */
  h += '<article class="lead">';
  if (stops.length) {
    const s0 = stops[0], t0 = splitTitle(s0);
    const head = t0.name + (t0.street && !t0.name.toLowerCase().includes(t0.street.toLowerCase()) && !t0.street.toLowerCase().includes(t0.name.toLowerCase()) ? ' at ' + t0.street : '');
    let deck = '';
    if (s0.start) deck += s0.start + (s0.end ? ' to ' + s0.end : '') + '. ';
    if (t0.job) deck += sentence(t0.job + (s0.who ? ' for ' + s0.who : '')) + ' ';
    if (s0.purpose) deck += sentence(s0.purpose) + ' ';
    if (realNote(s0.note)) deck += sentence(s0.note) + ' ';
    if (d.start && s0.driveFromPrev) deck += s0.driveFromPrev + '-minute drive from home, ' + streetOf(d.start) + '.';
    else if (d.start) deck += 'Drive time from home not set.';
    h += '<div class="kicker">First stop</div><h2>' + esc(head) + '</h2><p class="deck">' + telify(deck.trim()) + '</p>';
    if (s0.who && !t0.job) h += '<div class="who"><b>' + esc(s0.who) + '</b></div>';
    if (needsPurpose(s0)) h += '<div class="flag">Purpose / contact not set</div>';
    h += '<div class="navrow"><a class="btn solid" data-nav="0" href="' + mapsDir(s0.address, d.start) + '">Navigate</a></div>';
    if (stops[1]) {
      const s1 = stops[1], t1 = splitTitle(s1);
      h += '<div class="fact"><div class="k">Then</div><div><b>' + esc(t1.name) + '</b>' + (t1.job ? ' — ' + esc(t1.job) : '') +
           '<div class="tmeta">' + esc(s1.start || '') + (s1.end ? '–' + esc(s1.end) : '') +
           (s1.driveFromPrev ? ' · ' + s1.driveFromPrev + ' min drive' : '') + '</div>' +
           '<div class="muted">' + esc(s1.address || '') + '</div>' +
           (needsPurpose(s1) ? '<div><span class="flag">Purpose / contact not set</span></div>' : '') +
           '<div class="navrow"><a class="btn" data-nav="1" href="' + mapsDir(s1.address) + '">Navigate</a></div>' +
           (stops.length > 2 ? '<div class="muted" style="margin-top:8px">+ ' + (stops.length - 2) + ' more on the run below</div>' : '') +
           '</div></div>';
    }
  } else {
    h += '<div class="kicker">The route</div><h2>No stops today</h2>' +
         (insps.length || tasks.length ? '<p class="deck">See inspections and the desk below.</p>' : '');
  }
  h += '</article>';

  /* Column 1 — The run */
  let run = '<section class="col"><h3>The run<small class="mono">' + totalDrive + ' min driving' + (unknownLegs ? ' +' + unknownLegs + ' leg?' : '') + '</small></h3>';
  if (d.start) run += '<div class="fact"><div class="k">Start</div><div>' + esc(d.start) + '</div></div>';
  stops.forEach((s, i) => {
    const t = splitTitle(s);
    if (i > 0 || d.start) {
      run += '<div class="fact"><div class="k">Drive</div><div class="drive' + (s.driveFromPrev ? '' : ' unk') + '">' +
             (s.driveFromPrev ? s.driveFromPrev + ' min to ' + esc(t.name) : 'drive time not set') + '</div></div>';
    }
    const icon = /TUG/i.test(s.title) ? 'icons/tug.png' : /underground/i.test(s.title) ? 'icons/underground.png' : /walk/i.test(s.title) ? 'icons/walk.png' : null;
    const banner = icon ? icon.replace('.png', '-banner.png') : null;
    run += '<div class="fact stop" id="stop-' + i + '"><div class="k">' + esc(s.start || '') + (s.end ? '<small>to ' + esc(s.end) + '</small>' : '') + '<span class="nexttag" hidden>NEXT</span></div><div>';
    if (banner) run += '<img class="taskbanner" src="' + banner + '" alt="">';
    run += '<div class="nm"><label class="ck stopck" title="Mark done"><input type="checkbox" class="chk" data-done="' + i + '"' + (doneSet.has(i) ? ' checked' : '') + ' aria-label="Done"></label>' +
           (icon ? '<img class="taskicon" src="' + icon + '" alt="">' : '') + '<b>' + esc(t.name) + '</b></div>';
    if (t.job) run += '<div class="job">' + esc(t.job) + '</div>';
    run += '<div class="addr">' + esc(s.address || '') + '</div>';
    if (s.who) run += '<div><b>' + esc(s.who) + '</b></div>';
    if (s.purpose) run += '<div>' + telify(s.purpose) + '</div>';
    if (s.note) run += '<div>' + telify(s.note) + '</div>';
    if (needsPurpose(s)) run += '<span class="flag">Purpose / contact not set</span>';
    if (s.address && s.who && (s.livingSf != null || s.underRoofSf != null || s.livingSF != null || s.underRoofSF != null)) {
      const v = x => (x === null || x === undefined || x === '') ? 'not on file' : (typeof x === 'number' ? x.toLocaleString('en-US') : esc(String(x)));
      run += '<div class="sf">Living ' + v(s.livingSf ?? s.livingSF) + ' sf · Under roof ' + v(s.underRoofSf ?? s.underRoofSF) + ' sf</div>';
    }
    const b = brandFor(s);
    const jobUrl = s.trackUrl || (b && b.link);
    run += '<div class="navrow"><a class="btn" data-nav="' + i + '" href="' + mapsDir(s.address, i === 0 ? d.start : undefined) + '">Navigate</a>' +
           (jobUrl ? '<a class="lnk" href="' + esc(jobUrl) + '">SHARMATRACK job page</a>' : '') + '</div>';
    if (b) run += '<div class="brand">' + (b.logo ? '<img src="' + b.logo + '" alt="' + esc(b.alt) + '">' : '<span class="bbadge">' + esc(b.badge) + '</span>') + '</div>';
    const mats = s.materials || [];
    if (mats.length) {
      run += '<div class="mats"><div class="mlabel">Materials</div><ul class="list">';
      mats.forEach(m => {
        const id = 's' + i + '|' + m;
        run += '<li' + (checkSet.has(id) ? ' class="off"' : '') + '><label class="ck"><input type="checkbox" class="chk" data-check="' + esc(id) + '"' +
               (checkSet.has(id) ? ' checked' : '') + '>' + matImg(m) + '<span class="txt">' + matHTML(m) + '</span></label></li>';
      });
      run += '</ul></div>';
    }
    run += '</div></div>';
  });
  if (!stops.length) run += '<div class="fact"><div class="k">—</div><div class="muted">No stops on the route.</div></div>';
  run += '</section>';

  /* Column 2 — Inspections */
  const allCrew = insps.length && insps.every(x => /crew covers/i.test(x.note || ''));
  let ins = '<section class="col"><h3>Inspections<small>' + (insps.length ? (allCrew ? 'crew covers' : insps.length + ' today') : '') + '</small></h3>';
  insps.forEach(x => {
    const ph = phoneOf(x.contact);
    const crew = /crew covers/i.test(x.note || '');
    const who = x.inspector ? x.inspector : '';
    ins += '<div class="insp"><div class="itime">' + esc(x.time || '') + '</div>' +
           '<div class="ty">' + esc(x.type || '') + '</div>' +
           '<div>' + esc(x.address || '') + '</div>' +
           '<div class="muted">' + (x.permit ? '<span class="mono">#' + esc(String(x.permit).replace(/^#/, '')) + '</span>' : '') +
             (x.permit && who ? ' · ' : '') + esc(who ? 'Inspector ' + who : '') + '</div>' +
           (x.contact ? '<div class="muted">' + telify(x.contact) + '</div>' : '') +
           (x.note ? '<div class="muted" style="margin-top:4px">' + esc(x.note) + '</div>' : '') +
           (crew ? '<div style="margin-top:8px"><span class="crew">Crew covers</span></div>' : '') +
           '<div class="navrow">' +
             (ph ? '<a class="btn" href="tel:' + ph.replace(/\D/g, '') + '">' + esc(x.contact && phoneOf(x.contact) && String(x.contact).replace(PHONE, '').trim() ? callLabel(x.contact) : (who ? 'Call ' + who : 'Call')) + '</a>' : '') +
             (x.address ? '<a class="btn" href="' + mapsDir(x.address) + '">Navigate</a>' : '') + '</div></div>';
  });
  if (!insps.length) ins += '<div class="insp muted">No inspections today.</div>';
  ins += '</section>';

  /* Column 3 — Desk (office tasks) + Load the truck */
  let desk = '<section class="col"><h3>Desk<small id="taskSub"></small></h3><ul class="list">';
  tasks.forEach((x, k) => {
    const id = 'task|' + x.text;
    const txt = String(x.text || '');
    const cut = txt.indexOf(' — ');
    const head = cut > 0 ? txt.slice(0, cut) : txt, more = cut > 0 ? txt.slice(cut + 3) : '';
    desk += '<li class="task-li' + (checkSet.has(id) ? ' off' : '') + '"><div class="task"><label class="ck"><input type="checkbox" class="chk" data-check="' + esc(id) + '"' +
            (checkSet.has(id) ? ' checked' : '') + '><span class="txt"><b>' + telify(head) + '</b></span></label>' +
            (more ? '<button class="plus" type="button" aria-expanded="false" aria-controls="tm' + k + '" aria-label="More">+</button>' : '') + '</div>' +
            (more ? '<div class="more" id="tm' + k + '">' + telify(more) + '</div>' : '') + '</li>';
  });
  if (!tasks.length) desk += '<li class="muted" style="padding:12px 0">No office tasks.</li>';
  desk += '</ul>';
  const loadMap = new Map();
  stops.forEach(s => (s.materials || []).forEach(m => loadMap.set(m, (loadMap.get(m) || 0) + 1)));
  const load = [...loadMap.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (load.length) {
    desk += '<h3 class="sub2">Load the truck<small>' + load.length + ' items</small></h3><ul class="list mats">';
    load.forEach(([nm, n]) => {
      const id = 'load|' + nm;
      desk += '<li' + (checkSet.has(id) ? ' class="off"' : '') + '><label class="ck"><input type="checkbox" class="chk" data-check="' + esc(id) + '"' +
              (checkSet.has(id) ? ' checked' : '') + '>' + matImg(nm) + '<span class="txt">' + esc(nm) + '</span>' + (n > 1 ? '<span class="cnt">×' + n + '</span>' : '') + '</label></li>';
    });
    desk += '</ul>';
  }
  desk += '</section>';

  const app = document.getElementById('app');
  app.innerHTML = h + '<div class="brief-grid">' + run + ins + desk + '</div>';

  const paintCounts = () => {
    document.getElementById('counts').textContent =
      stops.length + ' stop' + (stops.length === 1 ? '' : 's') + ' · ' + insps.length + ' insp. · ' + openTasks() + ' task' + (openTasks() === 1 ? '' : 's') + ' open';
    document.getElementById('drivect').textContent =
      totalDrive + ' min driving' + (unknownLegs ? ' (+' + unknownLegs + ' leg?)' : '');
    const nx = nextIdx();
    document.getElementById('edition').textContent = (isLive ? '' : 'Saved edition · ') +
      (stops.length ? (nx >= 0 ? 'Stop ' + (nx + 1) + ' of ' + stops.length + ' next' : 'Day complete') : 'No stops');
    const ts = document.getElementById('taskSub'); if (ts) ts.textContent = openTasks() + ' open';
  };
  const paintDay = () => {
    const nx = nextIdx();
    stops.forEach((_, i) => {
      const el = document.getElementById('stop-' + i);
      if (!el) return;
      el.classList.toggle('done', doneSet.has(i));
      el.classList.toggle('next', i === nx);
      const tag = el.querySelector('.nexttag'); if (tag) tag.hidden = i !== nx;
      const nav = el.querySelector('.navrow .btn');
      if (nav) { nav.hidden = doneSet.has(i); nav.classList.toggle('solid', i === nx); }
    });
    paintCounts();
  };
  paintDay();

  app.addEventListener('click', e => {
    const p = e.target.closest('.plus');
    if (!p) return;
    const li = p.closest('li'); const open = li.classList.toggle('open');
    p.textContent = open ? '−' : '+'; p.setAttribute('aria-expanded', open);
  });
  app.addEventListener('change', e => {
    const cb = e.target;
    if (cb.matches('input[data-check]')) {
      /* Same material ticks together everywhere; tasks tick on their own text */
      const key = cb.dataset.check.split('|').slice(1).join('|');
      const kind = cb.dataset.check.split('|')[0];
      app.querySelectorAll('input[data-check]').forEach(o => {
        const ok = o.dataset.check.split('|')[0];
        const same = o.dataset.check.split('|').slice(1).join('|') === key && ((kind === 'task') === (ok === 'task'));
        if (same) {
          o.checked = cb.checked;
          const li = o.closest('li');
          if (li) li.classList.toggle('off', cb.checked);
          if (cb.checked) checkSet.add(o.dataset.check); else checkSet.delete(o.dataset.check);
        }
      });
      lsSet('myday-' + d.date + '-check', [...checkSet]);
      paintCounts();
    }
    if (cb.matches('input[data-done]')) {
      const i = +cb.dataset.done;
      if (cb.checked) doneSet.add(i); else doneSet.delete(i);
      lsSet('myday-' + d.date + '-done', [...doneSet]);
      paintDay();
    }
  });
}
</script>
</body>
</html>
